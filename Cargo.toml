[package]
name = "lens"
version = "0.1.0"
edition = "2021"
description = "Agent code review for Claude Code: profile selection and review plumbing."
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
